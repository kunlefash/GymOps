# GymOps / FitBase GitHub Integration Config
# Used by BMAD agents for repo operations.
#
# Topology: two repos, not three.
#   GymOps  — planning and orchestration (this repo)
#   fitbase — the application, a single Next.js monorepo
#
# architecture.md selected a Next.js App Router monorepo: UI, API routes and the
# Prisma schema deploy as one unit on Vercel. Express was explicitly rejected, so
# the earlier frontend/backend repo split (and its path-based routing rules) no
# longer applies. gymops-frontend and gymops-backend are abandoned scaffolds.

github:
  owner: kunlefash

  repos:
    main:
      name: GymOps
      url: https://github.com/kunlefash/GymOps
      description: "BMAD framework, planning artifacts, stories, sprint tracking"
      purpose: "orchestration"

    app:
      name: fitbase
      url: https://github.com/kunlefash/fitbase
      description: "FitBase application — Next.js 16 monorepo (UI + API routes + Prisma)"
      purpose: "source-code"
      visibility: private
      tech:
        ["next.js", "react", "typescript", "tailwind", "prisma", "postgresql"]

  default_branch: main

  branch_strategy:
    feature: "feat/{story-key}"
    bugfix: "fix/{story-key}"
    hotfix: "hotfix/{description}"

  pr_settings:
    auto_review: true
    require_approval: true
    reviewers: ["kunlefash"]
    labels:
      ai_generated: "ai-generated"
      needs_review: "needs-review"
      reviewed: "reviewed"

  automation:
    on_story_complete:
      - create_feature_branch
      - push_code
      - open_pr
      - trigger_code_review
      - notify_owner

    on_review_complete:
      - post_review_comments_to_pr
      - update_story_status
      - label_pr

    on_pr_merged:
      - update_story_to_done
      - update_sprint_status

  # All application code lives in one repo, so there is nothing to route.
  # Story changes land in `fitbase`; planning artifacts land in `GymOps`.
  repo_routing:
    default: app
    rules:
      - pattern: "_bmad-output/**"
        repo: main
      - pattern: "_bmad/**"
        repo: main
